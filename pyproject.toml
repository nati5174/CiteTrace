[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "citeprobe"
version = "0.1.0"
description = "Exploratory citation-retrieval pilot with inspectable identity evidence"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3", "httpx>=0.28,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "mypy>=1.14,<2"]
report = ["matplotlib>=3.9,<4"]

[project.scripts]
citeprobe = "citeprobe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
